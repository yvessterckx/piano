<button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 9px; border: none; background: transparent; color: #C5CBD3; font: 500 14px Inter, system-ui, sans-serif; cursor: pointer"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #4D8DF5"></span>Rechts</button>

<sc-for list="{{whites}}" as="k" hint-placeholder-count="52">
<div style="flex: 1 1 0; min-width: 0; box-sizing: border-box; height: 100%; margin-right: 1px; border-radius: 0 0 4px 4px; background: {{k.bg}}; color: {{k.fg}}; font-weight: {{k.weight}}; font-size: 11px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 9px">{{k.label}}</div>
</sc-for>
<sc-for list="{{blacks}}" as="b" hint-placeholder-count="36">
<div style="position: absolute; top: 0; left: {{b.left}}; width: {{b.width}}; height: 62%; border-radius: 0 0 3px 3px; background: #14171C"></div>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"toetsen":{"editor":"enum","options":["88","76","61"],"default":"88"},"notenamen":{"editor":"enum","options":["Do Re Mi","C D E"],"default":"Do Re Mi"},"$preview":{"width":1280,"height":880}}'>
class Component extends DCLogic {
renderVals() {
var count = String(this.props.toetsen ?? '88');
var ranges = { '88': [21, 108], '76': [28, 103], '61': [36, 96] };
var range = ranges[count] || ranges['88'];
var solfege = (this.props.notenamen ?? 'Do Re Mi') === 'Do Re Mi';
var names = solfege
? ['do', '', 're', '', 'mi', 'fa', '', 'sol', '', 'la', '', 'si']
: ['C', '', 'D', '', 'E', 'F', '', 'G', '', 'A', '', 'B'];
var isBlack = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];
var lit = { 45: 'L', 69: 'R' };
var whites = [];
var blackAt = [];
for (var m = range[0]; m <= range[1]; m++) {
var pc = m % 12;
if (isBlack[pc]) { blackAt.push(whites.length); continue; }
var hand = lit[m];
whites.push({
bg: hand === 'L' ? '#D9730D' : hand === 'R' ? '#1F6FEB' : '#FFFFFF',
fg: hand === 'L' ? '#14171C' : hand === 'R' ? '#FFFFFF' : '#5B6470',
weight: hand ? 700 : 500,
label: hand || pc === 0 ? names[pc] : ''
});
}
var n = whites.length;
var bw = 62 / n;
var blacks = blackAt.map(function (i) {
return { left: (i * 100 / n - bw / 2) + '%', width: bw + '%' };
});
return { toetsen: count, whites: whites, blacks: blacks };
}
}
</script>
